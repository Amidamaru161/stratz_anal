services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stratz_anal
      POSTGRES_USER: stratz
      POSTGRES_PASSWORD: stratz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratz -d stratz_anal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://stratz:stratz@postgres:5432/stratz_anal
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
